# Render blueprint — deploys the whole game as one free Node web service.
#
# Render supplies PORT; the server reads it from the environment.
# Every optional key below is blank by default and the game works without them.
#
# A free instance sleeps after 15 minutes without inbound traffic (and wakes in
# about half a minute; 32 s measured). That is safe for a party game because the client emits a
# keepalive every few minutes while somebody is in a room — see App.tsx and the
# C2S.keepalive handler — so an active session never goes quiet for long enough.
# With nobody in a room the service is meant to sleep and spend no instance hours;
# the README explains that idle lifecycle and the optional warm pinger.
# A sleep or restart still ends any game nobody is watching; rooms already end
# on their own after 4 idle hours.

services:
  - type: web
    name: grail-wars
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below applies to the build
    # too, and a production-only install has no vite to build the client with.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Pin the runtime: without this Render uses whatever its current default is,
      # which is how a free service silently drifts onto an unsupported line.
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # The public contact address: it goes into the User-Agent when calling
      # public wikis/APIs and is the address the README names for takedowns.
      # Please set it.
      - key: CONTACT_EMAIL
        sync: false
      # Where site feedback is delivered. Server-side only — it never reaches
      # the browser. Use a dedicated inbox, not your personal address.
      - key: FEEDBACK_TO
        sync: false
      # Any endpoint that turns the feedback POST into an email: a Google Apps
      # Script web app or a free Formspree form. Blank means feedback is only
      # logged, never emailed.
      - key: FEEDBACK_WEBHOOK_URL
        sync: false
      # Optional LLM layer. Polishes narration only; it never decides a fight.
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional image providers.
      - key: TMDB_API_KEY
        sync: false
      - key: IMAGE_SEARCH_PROVIDER
        value: none
      - key: BRAVE_SEARCH_KEY
        sync: false
      - key: GOOGLE_CSE_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
